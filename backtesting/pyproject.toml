[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-backtesting"
version = "0.1.0"
description = "Deterministic PMXT replay for the live multi-outcome basket strategy"
requires-python = ">=3.10"
dependencies = [
  "fsspec>=2024.0",
  "nicegui>=2.0,<3",
  "openai>=1.50",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "plotly>=5.20",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
backtesting = "backtesting.main:main"

[tool.setuptools.packages.find]
where = ["src"]
