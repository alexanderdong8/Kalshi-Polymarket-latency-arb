[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-trading"
version = "0.1.0"
description = "Multi-outcome Kalshi / Polymarket US monitor, paper trader, and live trader"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "cryptography>=42.0",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "nicegui>=2.0,<3",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "rich>=13.7",
  "websockets>=14.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
live-trading = "live_trading.main:main"

[tool.setuptools.packages.find]
where = ["src"]
